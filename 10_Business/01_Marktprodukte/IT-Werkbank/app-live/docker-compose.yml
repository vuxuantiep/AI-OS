services:
  werkbank:
    build: .
    ports: ["8090:8080"]
    # Reihenfolge wichtig: die zentrale AI-OS-Root-.env liefert alle API-
    # Schluessel, die lokale .env danach nur noch Modul-/Modellauswahl.
    # Bei gleichem Variablennamen gewinnt die spaeter genannte Datei -- da
    # die lokale .env keine Schluessel mehr definiert, ueberschreibt sie
    # dort nichts, sondern ergaenzt nur.
    # "../../../../.env" gilt nur innerhalb des AI-OS-Monorepos (dort 4 Ebenen
    # hoch = Repo-Wurzel) -- im eigenstaendigen Gitea-Deployment auf dem Pi4
    # gibt es diese Verschachtelung nicht, dort muss die lokale .env alle
    # Werte direkt enthalten. "required: false" verhindert einen harten
    # Fehler an dieser Stelle, statt zwei verschiedene Compose-Dateien fuer
    # PC und Pi4 pflegen zu muessen.
    env_file:
      - path: "../../../../.env"
        required: false
      - path: ".env"
        required: true
    volumes: ["werkbank-daten:/daten"]
    depends_on: [qdrant]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes: ["qdrant-daten:/qdrant/storage"]
    restart: unless-stopped

volumes:
  werkbank-daten:
  qdrant-daten:
