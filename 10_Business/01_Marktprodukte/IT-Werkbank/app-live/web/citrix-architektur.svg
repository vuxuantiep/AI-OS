<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" width="1280" height="790" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
<title>Citrix Virtual Apps and Desktops auf Windows Server 2022 – Architektur</title>
<defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><style>.t{font-size:15px;font-weight:700;fill:#0f172a}.h{font-size:13px;font-weight:700;fill:#0f172a}.s{font-size:12px;fill:#334155}.k{font-size:11px;fill:#475569}.lab{font-size:11px;font-weight:600;fill:#1e293b}.pfeil{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#pf)}.zwei{marker-start:url(#pf)}.gestr{stroke-dasharray:6 4}</style></defs>
<rect width="1280" height="790" fill="#ffffff"/>
<text x="30" y="38" style="font-size:22px;font-weight:800;fill:#0f172a">Citrix Virtual Apps and Desktops auf Windows Server 2022 – Architektur</text>
<text x="30" y="58" class="k">Der Anwender arbeitet nie am Endgerät: Die Anwendung läuft auf dem Server, nur Bild, Ton und Eingaben gehen über HDX</text>
<rect x="30" y="75" width="200" height="440" rx="10" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4"/>
