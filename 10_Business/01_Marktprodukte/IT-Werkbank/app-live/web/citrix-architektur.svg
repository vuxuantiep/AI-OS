<text x="792" y="155" class="lab" text-anchor="start">80/443</text>
<path class="pfeil zwei" d="M130,365 L130,500 L820,500 L820,345 L855,345"/>
<text x="240" y="494" class="lab" text-anchor="start">HDX/ICA 1494, Session Reliability 2598 (TCP, bei EDT auch UDP), über Gateway: 443</text>
<text x="30" y="690" class="h" text-anchor="start">So liest du das Bild</text>
<text x="30" y="710" class="s" text-anchor="start">Anmelden (StoreFront) und Arbeiten (HDX) sind zwei getrennte Wege. Fällt der Controller aus, laufen offene Sitzungen meist weiter – neue Starts scheitern.</text>
<text x="30" y="730" class="s" text-anchor="start">Gestrichelter Pfeil: Weg von außen über das Gateway. Durchgezogener Pfeil unten: die eigentliche Arbeitssitzung zwischen Endgerät und Server.</text>
<text x="30" y="750" class="k" text-anchor="start">Ports laut Citrix-Dokumentation (Stand 11/2026), im eigenen Netz gegen die Firewall-Freigaben prüfen.</text>
