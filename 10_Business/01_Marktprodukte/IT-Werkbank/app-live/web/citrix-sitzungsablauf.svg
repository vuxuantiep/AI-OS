<circle cx="770" cy="565" r="12" fill="#2563eb"/>
<text x="770" y="569" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">8</text>
<text x="800" y="569" class="s" text-anchor="start">Windows meldet an: GPO, FSLogix-Profil, Skripte</text>
