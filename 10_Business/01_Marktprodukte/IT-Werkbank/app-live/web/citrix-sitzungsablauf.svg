<path class="pfeil" d="M130,517 L1080,517"/>
<rect x="449.5" y="488" width="311.0" height="24" rx="5" fill="#fff" stroke="#cbd5e1"/>
<circle cx="449.5" cy="500" r="12" fill="#2563eb"/>
<text x="449.5" y="504" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">7</text>
