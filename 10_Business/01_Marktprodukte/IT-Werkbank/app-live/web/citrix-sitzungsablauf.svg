<path class="pfeil" d="M570,277 L800,277"/>
<rect x="539.25" y="248" width="291.5" height="24" rx="5" fill="#fff" stroke="#cbd5e1"/>
<circle cx="539.25" cy="260" r="12" fill="#2563eb"/>
<text x="539.25" y="264" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">3</text>
<text x="691.0" y="265" class="s" text-anchor="middle">StoreFront fragt: Was darf dieser Benutzer?</text>
<path class="pfeil" d="M800,337 L130,337"/>
<rect x="335.5" y="308" width="259.0" height="24" rx="5" fill="#fff" stroke="#cbd5e1"/>
<circle cx="335.5" cy="320" r="12" fill="#2563eb"/>
<text x="335.5" y="324" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">4</text>
