  <text x="1170" y="1000" class="x"> </text>

  <!-- ================= Leitplanken ================= -->
  <rect x="30" y="935" width="1740" height="140" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="50" y="966" class="h">Leitplanken (Gate-Auflagen, CEO-Freigabe 13.10.2026)</text>
  <g class="s">
    <rect x="50" y="985" width="400" height="72" rx="10" fill="#f1f5f9"/>
    <text x="66" y="1013" class="t">A1/A2 Praxistest zuerst</text>
    <text x="66" y="1039">max. 500 € Ware · Meilenstein vor Ausbau</text>
    <rect x="470" y="985" width="400" height="72" rx="10" fill="#f1f5f9"/>
    <text x="486" y="1013" class="t">A3 Zeitdeckel</text>
    <text x="486" y="1039">≤ 5 h/Woche (EMVIA hat Vorrang)</text>
    <rect x="890" y="985" width="420" height="72" rx="10" fill="#f1f5f9"/>
    <text x="906" y="1013" class="t">A4 Recht/Steuer vor 1. Einkauf</text>
    <text x="906" y="1039">Gewerbe · USt · LUCID · GPSR</text>
    <rect x="1330" y="985" width="420" height="72" rx="10" fill="#f1f5f9"/>
    <text x="1346" y="1013" class="t">A5/A6 Kosten &amp; Stack</text>
    <text x="1346" y="1039">Abos ≤ 20 €/Mon. · nur AI-OS-Bestand</text>
  </g>
</svg>
