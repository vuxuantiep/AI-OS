  <path class="ln" d="M372,275 L436,205"/>
  <path class="ln" d="M372,467 L436,215"/>
  <path class="ln" d="M372,610 L436,225"/>
  <path class="ln" d="M372,747 L436,235"/>
  <path class="ln" d="M694,205 L770,259"/>
